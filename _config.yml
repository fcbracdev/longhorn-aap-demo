title: Longhorn AAP Demo
email:
description: POC based on existing Longhorn AAP documentation
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: fcbracdev/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone:  	America/Chicago

include:
  - _pages

lunr:
  search_within_pages: true
  
search_full_content: true 

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
    values:
      sidebar: 
        nav: 
        - background
        - sites
        - get-involved
        - remedial
        - plume
        - admin
      layout: single
minimal_mistakes_skin: "contrast" # , "dark", "dirt", "neon", "mint", "plum", "sunrise"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
